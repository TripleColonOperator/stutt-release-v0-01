<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reubarb glyph encoding preview</title>
  <style>
    @font-face { font-family: 'Reubarb Pi Symbols'; src: url('fonts/v0_1/ReubarbPiSymbols-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .35rem; }
    .notice { max-width: 75ch; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 2rem; }
    figure { margin: 0; padding: 1rem; border: 1px solid #8888; border-radius: .6rem; text-align: center; }
    img { width: min(100%, 60vh); height: auto; aspect-ratio: 5 / 6; object-fit: contain; color: currentColor; }
    figcaption { display: grid; gap: .35rem; }
    code { font-size: 1rem; }
    .raw { font-family: 'Reubarb Pi Symbols', monospace; font-size: clamp(100px, 50vw, 60vh); line-height: 1.3; font-weight: 400; font-style: normal; font-synthesis: none; }
    .fallback { font-family: ui-monospace, monospace; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Reubarb glyph encoding preview</h1>
  <p class="notice">Large glyph view: each approved SVG and its real character scale to the window. The page loads the bundled font locally. The SVG remains the approved visual reference. This static page performs no recognition, storage, network access, or execution.</p>
  <main class="grid" aria-label="Approved encoded Reubarb glyphs">
    <figure data-design-id="2" data-code-point="U+E100">
      <img src="glyphs/v0_1/rp_g02_congruent_statement.svg" alt="Reubarb glyph G2 visual geometry">
      <figcaption><strong>G2</strong><code>U+E100 · rb.g2</code><span class="raw" aria-label="Raw U+E100">&#xE100;</span><span class="fallback">[Reubarb G2 U+E100]</span></figcaption>
    </figure>
    <figure data-design-id="3" data-code-point="U+E101">
      <img src="glyphs/v0_1/rp_g03_fulfilled_overlay.svg" alt="Reubarb glyph G3 visual geometry">
      <figcaption><strong>G3</strong><code>U+E101 · rb.g3</code><span class="raw" aria-label="Raw U+E101">&#xE101;</span><span class="fallback">[Reubarb G3 U+E101]</span></figcaption>
    </figure>
    <figure data-design-id="4" data-code-point="U+E102">
      <img src="glyphs/v0_1/rp_g04_strong_variant.svg" alt="Reubarb glyph G4 visual geometry">
      <figcaption><strong>G4</strong><code>U+E102 · rb.g4</code><span class="raw" aria-label="Raw U+E102">&#xE102;</span><span class="fallback">[Reubarb G4 U+E102]</span></figcaption>
    </figure>
    <figure data-design-id="5" data-code-point="U+E103">
      <img src="glyphs/v0_1/rp_g05_neutral_variant.svg" alt="Reubarb glyph G5 visual geometry">
      <figcaption><strong>G5</strong><code>U+E103 · rb.g5</code><span class="raw" aria-label="Raw U+E103">&#xE103;</span><span class="fallback">[Reubarb G5 U+E103]</span></figcaption>
    </figure>
    <figure data-design-id="6" data-code-point="U+E104">
      <img src="glyphs/v0_1/rp_g06_weak_variant.svg" alt="Reubarb glyph G6 visual geometry">
      <figcaption><strong>G6</strong><code>U+E104 · rb.g6</code><span class="raw" aria-label="Raw U+E104">&#xE104;</span><span class="fallback">[Reubarb G6 U+E104]</span></figcaption>
    </figure>
  </main>
</body>
</html>
